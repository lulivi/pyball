services:
  app:
    image: ${IMAGE:?IMAGE must be set in .env}:${TAG:-latest}
    user: "${UID}:${GID}"
    ports:
      - "127.0.0.1:${PORT}:8000"
    volumes:
      - "./config.toml:/pyball/config.toml"
      - "./logs:/pyball/logs"
      - "./data:/pyball/data"
      - "./plugins:/pyball/plugins"
    restart: unless-stopped
