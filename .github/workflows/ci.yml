name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-publish and re-deploy an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish and deploy (e.g. v6.9.0)
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_IMAGE: ghcr.io/lulivi/pyball-ci:latest

jobs:
  ci-image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            dockerfile:
              - docker/Dockerfile.ci
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the CI image when it changed, on main, or when it is missing
        env:
          CHANGED: ${{ steps.changes.outputs.dockerfile }}
        run: |
          if [ "$CHANGED" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ] \
              && docker manifest inspect "$CI_IMAGE" > /dev/null 2>&1; then
            echo "CI image is up to date; skipping build."
            exit 0
          fi
          docker build -f docker/Dockerfile.ci -t "$CI_IMAGE" .
          docker push "$CI_IMAGE"

  lint:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lulivi/pyball-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .nox
          key: nox-lint-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: nox -e lint

  test:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      checks: write
    container:
      image: ghcr.io/lulivi/pyball-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .nox
          key: nox-test-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: nox -e test -- --junit-xml=TestReport.xml
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: TestReport.xml
          check_name: test report

  plugins:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lulivi/pyball-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            plugins/*/target
            /usr/local/cargo/registry
          key: plugins-${{ hashFiles('plugins/*/Cargo.lock', 'plugins/*/rust-toolchain.toml') }}
      - run: make plugins-check

  actionlint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  caddyfiles:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: lulivi/pyball-caddy:latest
    env:
      DUCKDNS_TOKEN: dummy
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Caddyfile with no club enabled, then with one
        run: |
          mkdir -p deploy/caddy/enabled
          caddy validate --adapter caddyfile --config deploy/caddy/Caddyfile
          echo "import club sample 8000" > deploy/caddy/enabled/sample
          caddy validate --adapter caddyfile --config deploy/caddy/Caddyfile

  # The release commit and tag are pushed with GITHUB_TOKEN, so they start no
  # new workflow run: publish and deploy run here, chained on the release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, plugins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/lulivi/pyball-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      UV_LINK_MODE: copy
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # The release deploy key is the only actor allowed to push to main
      # without the required checks (main ruleset bypass list).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git checkout -B main "$GITHUB_SHA"
          uv run --only-group dev semantic-release version
          echo "tag=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"

  publish-deploy:
    needs: release
    if: ${{ !cancelled() && !failure() && (needs.release.outputs.tag || inputs.tag) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish every topology image
        run: |
          for topology in pyball telegram; do
            ./deploy/docker_build.sh --push --release --topology "$topology"
          done
      - uses: ./.github/actions/ssh-agent
        with:
          private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          host: ${{ secrets.SERVER_IP }}
      # Every directory under SERVER_APPS_DIR is a club: the glob expands on
      # the server, so adding a club takes no CI change.
      - name: Deploy every club
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
          APPS_DIR: ${{ secrets.SERVER_APPS_DIR }}
          DEPLOY_NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
          DEPLOY_NOTIFY_CHAT_ID: ${{ secrets.DEPLOY_NOTIFY_CHAT_ID }}
          DEPLOY_NOTIFY_THREAD_ID: ${{ secrets.DEPLOY_NOTIFY_THREAD_ID }}
        # bash enables pipefail: a failing deploy_input.sh must fail the step.
        shell: bash
        run: |
          # shellcheck disable=SC2029  # VERSION/APPS_DIR expand here on purpose
          ./deploy/deploy_input.sh compose.app.yaml \
            | ssh "$SERVER" "VERSION=${TAG#v} sh -s -- ${APPS_DIR:?}/*/"

  # Caddy and funnelbot are published and deployed only when their files
  # changed since the previous tag.
  publish-deploy-caddy:
    needs: release
    if: ${{ !cancelled() && !failure() && (needs.release.outputs.tag || inputs.tag) }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag || inputs.tag }}
      CADDY_PATHS: docker/Dockerfile.caddy docker/Dockerfile.funnelbot deploy/caddy compose.caddy.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - id: changes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          # shellcheck disable=SC2086
          if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" "$TAG" -- $CADDY_PATHS; then
            echo "No caddy changes since ${PREV_TAG}; skipping publish and deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION="${TAG#v}"
          for name in caddy funnelbot; do
            docker build -f "docker/Dockerfile.$name" \
              -t "lulivi/pyball-$name:$VERSION" -t "lulivi/pyball-$name:latest" .
            docker push "lulivi/pyball-$name:$VERSION"
            docker push "lulivi/pyball-$name:latest"
          done
      - if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/ssh-agent
        with:
          private-key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          host: ${{ secrets.SERVER_IP }}
      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}
          CADDY_DIR: ${{ secrets.SERVER_CADDY_DIR }}
          DEPLOY_NOTIFY_TOKEN: ${{ secrets.DEPLOY_NOTIFY_TOKEN }}
          DEPLOY_NOTIFY_CHAT_ID: ${{ secrets.DEPLOY_NOTIFY_CHAT_ID }}
          DEPLOY_NOTIFY_THREAD_ID: ${{ secrets.DEPLOY_NOTIFY_THREAD_ID }}
        # bash enables pipefail: a failing deploy_input.sh must fail the step.
        shell: bash
        run: |
          # Only the Caddyfile: enabled/ holds funnelbot's on/off state.
          scp deploy/caddy/Caddyfile "$SERVER:$CADDY_DIR/"
          # shellcheck disable=SC2029  # VERSION/CADDY_DIR expand here on purpose
          ./deploy/deploy_input.sh compose.caddy.yaml \
            | ssh "$SERVER" "VERSION=${TAG#v} HEALTH_MODE=caddy sh -s -- ${CADDY_DIR:?}"
