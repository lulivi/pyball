<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<title>PyBall Apuntarse</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
  body { padding: 16px 12px 24px; max-width: 420px; margin: 0 auto; }

  .page-title { text-align: center; padding: 8px 0 20px; font-size: 1.2rem; font-weight: bold; }

  .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .field-label { font-size: 0.75rem; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .code-input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 1.4rem; letter-spacing: 0.2em; text-align: center; text-transform: uppercase; padding: 12px; margin-bottom: 10px; }

  .btn { width: 100%; padding: 12px; font-size: 0.95rem; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }
  .btn-blue { background: #2563eb; }
  .btn-green { background: #16a34a; }
  .btn-red { background: #b91c1c; }
  .btn-gray { background: #334155; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg { color: #fca5a5; font-size: 0.85rem; margin-bottom: 10px; }
  .player-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
  .meetup-info { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
  .team-badge { display: inline-block; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 12px; margin-bottom: 8px; }
  .roster-list { list-style: none; margin-bottom: 12px; }
  .team-card { border: 1px solid #334155; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .team-header { padding: 7px 14px; font-size: 0.78rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
  .teammate-list { list-style: none; margin: 0; padding: 4px 14px; }
  .roster-list li, .teammate-list li { padding: 6px 0; border-bottom: 1px solid #334155; font-size: 0.9rem; }
  .teammate-list li.me { color: #4ade80; font-weight: bold; }
  .link-btn { background: none; border: none; color: #38bdf8; font-size: 0.82rem; cursor: pointer; text-decoration: underline; padding: 4px 0; display: block; margin: 0 auto; }
  .closed-note { font-size: 0.82rem; color: #fbbf24; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="page-title">⚽ PyBall — Apuntarse</div>
  <div id="app"></div>
  <script type="module" src="/signup-static/js/main.js"></script>
</body>
</html>
