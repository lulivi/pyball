<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest-match.json">
    <title>PyBall - Muro de Partido</title>
    <style>
        :root { --color-light: #e4e4e7; --color-light-text: #27272a; --color-dark: #27272a; --color-dark-text: #e4e4e7; --bg: #0f172a; --text: #f8fafc; }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            overflow-y: auto;
        }

        .match-date {
            text-align: center;
            font-size: 1.25rem;
            color: #64748b;
            padding: 2px 0 8px;
            flex-shrink: 0;
        }

        .scoreboard {
            background: #71717a;
            border-radius: 10px;
            border: 1px solid #a1a1aa;
            padding: 8px 12px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .team-score { display: flex; flex-direction: column; align-items: center; flex: 1; }

        .team-name {
            font-size: clamp(0.95rem, 4vw, 1.15rem);
            color: #cbd5e1;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: center;
        }

        .score-number {
            font-size: clamp(4rem, 35vw, 8.5rem);
            font-weight: bold;
            line-height: 1;
        }

        .score-a { color: var(--color-light); }
        .score-b { color: var(--color-dark); }

        .score-separator {
            font-size: clamp(1.5rem, 7vw, 3rem);
            font-weight: bold;
            color: #1e293b;
            padding: 0 8px;
        }

        .instruction {
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            color: #cbd5e1;
            text-align: center;
            margin: 0 0 6px;
            flex-shrink: 0;
        }

        .instruction.assist { color: #fbbf24; }

        .player-grid { display: flex; gap: 8px; flex: 1; min-height: 0; }

        .team-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .team-col.waiting {
            align-items: center;
            justify-content: center;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 6px;
            border: 1px dashed #334155;
        }

        .player-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.3rem, 6.5vw, 1.7rem);
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            min-height: 44px;
        }

        .btn-a { background: var(--color-light); color: var(--color-light-text); }
        .btn-b { background: var(--color-dark); color: var(--color-dark-text); }

        /* ── TABS ────────────────────────────────────────── */
        .tab-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 4px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 1rem;
            font-weight: bold;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #334155;
            color: #f8fafc;
        }

        #event-list {
            padding: 6px 10px;
        }

        .event-log {
            font-size: 1.05rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            min-height: 44px;
        }

        .truncate-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 0 1 auto;
        }

        .event-log:last-child { border-bottom: none; }

        .event-log.team-a {
            border-left: 4px solid var(--color-light);
            background: color-mix(in srgb, var(--color-light) 14%, transparent);
        }
        .event-log.team-b {
            border-left: 4px solid var(--color-dark);
            background: color-mix(in srgb, var(--color-dark) 14%, transparent);
        }

        .event-time {
            font-size: 0.9rem;
            color: #64748b;
            flex-shrink: 0;
        }

        .player-chip {
            display: flex; align-items: center; gap: 2px; justify-content: center;
            background: #0f172a; border: 1px solid #475569;
            border-radius: 6px; padding: 6px 4px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            color: #f8fafc; white-space: nowrap; width: 100%;
            line-height: 1.4; box-sizing: border-box;
        }
        .player-chip.active { border-color: var(--color-dark-text); background: var(--color-dark); }
        .player-chip .chevron {
            font-size: 0.6rem;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .player-chip:hover { background: #1e293b; }

        .cancel-full-btn {
            background: #f44336; flex: 1; height: 100%; width: 100%;
            border: none; border-radius: 6px; color: white;
            font-size: clamp(1.3rem, 6.5vw, 1.7rem); font-weight: bold; cursor: pointer;
            padding: 0; min-height: 44px;
        }
        .cancel-full-btn:hover { background: #d32f2f; }
        .cancel-split-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            height: 100%;
        }
        .own-goal-btn {
            flex: 1; width: 100%; border: none; border-radius: 6px;
            font-size: clamp(1.3rem, 6.5vw, 1.7rem); font-weight: bold; line-height: 1.2;
            cursor: pointer; padding: 4px 0; min-height: 44px;
        }
        .own-goal-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.75rem;
            color: #fca5a5;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .delete-btn {
            background: transparent; border: none; color: #ef4444;
            font-size: 0.9rem; cursor: pointer; flex-shrink: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.1); border-radius: 4px; }

        .event-log.editing { flex-wrap: wrap; align-items: flex-start; }

        .picker-dropdown {
            background: #1e293b; border: 1px solid #475569; border-radius: 8px;
            padding: 4px; margin-top: 4px;
            max-height: 180px; overflow-y: auto;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .picker-item {
            padding: 6px 10px; border-radius: 5px; font-size: 1rem;
            cursor: pointer; color: #f8fafc;
        }
        .picker-item:active { background: #334155; }
        .picker-item.selected { background: #1d4ed8; }
        .picker-item.no-assist { color: #fbbf24; }

        .save-btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: #16a34a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-btn:disabled { background: #475569; cursor: not-allowed; }

        .save-btn-armed { background: #b45309; }
        .save-btn-armed:hover { background: #92400e; }

        .save-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-align: center;
        }

        .events-tab {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .events-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .events-footer {
            flex-shrink: 0;
            margin-top: 12px;
        }

        /* ── TIMER ───────────────────────────────────────── */
        .timer-tab {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .timer-countdown, .timer-step-value {
            font-size: clamp(3rem, 18vw, 5rem);
            font-weight: bold;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .timer-stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 4vw, 24px);
            width: 100%;
        }

        .timer-step {
            flex-shrink: 0;
            width: clamp(48px, 13vw, 64px);
            height: clamp(48px, 13vw, 64px);
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            font-weight: bold;
            color: #f8fafc; background: #334155;
            border: none; border-radius: 12px; cursor: pointer;
        }

        .timer-step-value small {
            font-size: clamp(0.9rem, 4.5vw, 1.5rem);
            color: #94a3b8;
            margin-left: 6px;
        }

        .timer-btn {
            width: 100%; max-width: 320px;
            padding: 16px;
            font-size: 1.2rem; font-weight: bold;
            color: white; border: none; border-radius: 8px; cursor: pointer;
        }
        .timer-btn-start { background: #16a34a; }
        .timer-btn-reset { background: #b45309; }
        .timer-sound-btn { background: #0369a1; }

        /* Added to <body> by flashApp() only while flashing, then removed —
           no permanent top layer to leave compositing ghosts on reload. */
        #timer-flash-overlay {
            position: fixed;
            inset: 0;
            background: #f59e0b;
            pointer-events: none;
            z-index: 9999;
            animation: timer-flash 1.2s ease-in-out;
        }
        @keyframes timer-flash {
            0%, 33.3%, 66.6%, 100% { opacity: 0; }
            16.6%, 50%, 83.3% { opacity: 0.72; }
        }

        .timer-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
            padding: 2px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: #fef3c7;
            background: #b45309;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            vertical-align: middle;
        }

        .timer-pill-muted {
            background: #7c2d12;
            color: #fecaca;
            animation: timer-pill-pulse 1.4s ease-in-out infinite;
        }
        @keyframes timer-pill-pulse { 50% { opacity: 0.55; } }

        .timer-card {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: #1e293b;
            border-radius: 14px;
            box-sizing: border-box;
        }

        .timer-card-title {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #94a3b8;
            text-align: center;
        }

        .hourwarn-btn-off { background: #4f46e5; }
        .hourwarn-btn-on { background: #7c2d12; }

        /* ── NO MATCH / SUCCESS ──────────────────────────── */
        .no-match {
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            gap: 12px;
        }

        .no-match-icon { font-size: 3rem; }
        .no-match-title { font-size: 1.4rem; font-weight: bold; }
        .no-match-msg { font-size: 1rem; color: #64748b; line-height: 1.6; }

        .success-banner {
            background: #15803d;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: bold;
        }

        .edit-mode-banner {
            background: #92400e;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            color: #fef3c7;
        }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #334155; border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/js/match/main.js"></script>
</body>
</html>
