<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest-match.json">
    <title>PyBall - Muro de Partido</title>
    <style>
        :root { --color-light: #e4e4e7; --color-light-text: #27272a; --color-dark: #27272a; --color-dark-text: #e4e4e7; --bg: #0f172a; --text: #f8fafc; }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            overflow-y: auto;
        }

        .match-date {
            text-align: center;
            font-size: 1.25rem;
            color: #64748b;
            padding: 2px 0 8px;
            flex-shrink: 0;
        }

        .scoreboard {
            background: #71717a;
            border-radius: 10px;
            border: 1px solid #a1a1aa;
            padding: 8px 12px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .team-score { display: flex; flex-direction: column; align-items: center; flex: 1; }

        .team-name {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: center;
        }

        .score-number {
            font-size: clamp(4rem, 35vw, 8.5rem);
            font-weight: bold;
            line-height: 1;
        }

        .score-a { color: var(--color-light); }
        .score-b { color: var(--color-dark); }

        .score-separator {
            font-size: clamp(1.5rem, 7vw, 3rem);
            font-weight: bold;
            color: #1e293b;
            padding: 0 8px;
        }

        .instruction {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
            margin: 0 0 6px;
            flex-shrink: 0;
        }

        .instruction.assist { color: #fbbf24; }

        .player-grid { display: flex; gap: 8px; flex: 1; min-height: 0; }

        .team-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .team-col.waiting {
            align-items: center;
            justify-content: center;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 6px;
            border: 1px dashed #334155;
        }

        .player-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            min-height: 44px;
        }

        .btn-a { background: var(--color-light); color: var(--color-light-text); }
        .btn-b { background: var(--color-dark); color: var(--color-dark-text); }

        /* ── TABS ────────────────────────────────────────── */
        .tab-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 4px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #334155;
            color: #f8fafc;
        }

        #event-list {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 6px 10px;
            margin-bottom: 12px;
        }

        .event-log {
            font-size: 0.85rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding: 8px 4px;
            display: flex;
            align-items: center;
            min-height: 44px;
        }

        .truncate-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 0 1 auto;
        }

        .event-log:last-child { border-bottom: none; }

        .event-time {
            font-size: 0.75rem;
            color: #64748b;
            flex-shrink: 0;
        }

        .player-chip {
            display: flex; align-items: center; gap: 2px; justify-content: center;
            background: #0f172a; border: 1px solid #475569;
            border-radius: 6px; padding: 6px 4px;
            font-size: 0.8rem; font-weight: 600; cursor: pointer;
            color: #f8fafc; white-space: nowrap; width: 100%;
            line-height: 1.4; box-sizing: border-box;
        }
        .player-chip.active { border-color: var(--color-dark-text); background: var(--color-dark); }
        .player-chip .chevron {
            font-size: 0.6rem;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .player-chip:hover { background: #1e293b; }

        .cancel-full-btn {
            background: #f44336; flex: 1; height: 100%; width: 100%;
            border: none; border-radius: 6px; color: white;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            padding: 0; min-height: 44px;
        }
        .cancel-full-btn:hover { background: #d32f2f; }

        .delete-btn {
            background: transparent; border: none; color: #ef4444;
            font-size: 0.9rem; cursor: pointer; flex-shrink: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.1); border-radius: 4px; }

        .event-log.editing { flex-wrap: wrap; align-items: flex-start; }

        .picker-dropdown {
            background: #1e293b; border: 1px solid #475569; border-radius: 8px;
            padding: 4px; margin-top: 4px;
            max-height: 180px; overflow-y: auto;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .picker-item {
            padding: 6px 10px; border-radius: 5px; font-size: 0.8rem;
            cursor: pointer; color: #f8fafc;
        }
        .picker-item:active { background: #334155; }
        .picker-item.selected { background: #1d4ed8; }
        .picker-item.no-assist { color: #fbbf24; }

        .save-btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: #16a34a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-btn:disabled { background: #475569; cursor: not-allowed; }

        /* ── NO MATCH / SUCCESS ──────────────────────────── */
        .no-match {
            height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            gap: 12px;
        }

        .no-match-icon { font-size: 3rem; }
        .no-match-title { font-size: 1.4rem; font-weight: bold; }
        .no-match-msg { font-size: 1rem; color: #64748b; line-height: 1.6; }

        .success-banner {
            background: #15803d;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: bold;
        }

        .edit-mode-banner {
            background: #92400e;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            color: #fef3c7;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ── STATE (Single Source of Truth) ────────────────────
    let teamA = [], teamB = [];
    let nameA = 'A', nameB = 'B';
    let meetupDate = '';
    let isEditMode = false;

    let appState = {
        events: [], // Goals are calculated dynamically from this array
        currentStep: 1,
        tempScorer: null, tempScorerTeam: null,
        editingEvent: null,
        activeTab: 'players'
    };

    // ── STATE UTILITIES AND PERSISTENCE ───────────────────
    function persistState() {
        if (!isEditMode) {
            localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        }
    }

    function getGoals(teamId) {
        return appState.events.filter(e => e.team === teamId).length;
    }

    function setTab(tabName) {
        appState.activeTab = tabName;
        renderApp();
    }

    // ── INIT ──────────────────────────────────────────────
    function initializeApp() {
        const params = new URLSearchParams(window.location.search);
        const colorA = params.get('colorA');
        const colorB = params.get('colorB');
        const colorTextA = params.get('colorTextA');
        const colorTextB = params.get('colorTextB');
        if (colorA) {
            document.documentElement.style.setProperty('--color-light', colorA);
            document.documentElement.style.setProperty('--color-light-text', colorTextA);
            document.documentElement.style.setProperty('--color-dark', colorB);
            document.documentElement.style.setProperty('--color-dark-text', colorTextB);
        }

        if (params.get('edit') === '1') {
            isEditMode = true;
            const editDate = params.get('date') || '';
            if (editDate) {
                loadEditMode(editDate);
            } else {
                renderNoMatch();
            }
            return;
        }

        const savedState = localStorage.getItem('pyball_current_match');
        const savedTeams = localStorage.getItem('pyball_teams');
        const urlDate = params.get('date') || '';

        if (savedState && savedTeams) {
            const teams = JSON.parse(savedTeams);
            if (!urlDate || teams.meetupDate === urlDate) {
                appState = JSON.parse(savedState);
                appState.editingEvent = null;
                teamA = teams.teamA; teamB = teams.teamB;
                nameA = teams.nameA || 'A'; nameB = teams.nameB || 'B';
                meetupDate = teams.meetupDate;
                if (teams.colorA) {
                    document.documentElement.style.setProperty('--color-light', teams.colorA);
                    document.documentElement.style.setProperty('--color-light-text', teams.colorTextA);
                    document.documentElement.style.setProperty('--color-dark', teams.colorB);
                    document.documentElement.style.setProperty('--color-dark-text', teams.colorTextB);
                }
                renderApp();
                loadActiveMatch(); // validate against server; clears stale cache on 404
                return;
            }
            const oldDate = formatMatchDate(teams.meetupDate);
            if (!confirm(`Hay un partido del ${oldDate} sin guardar.\n¿Empezar el de hoy y descartar el anterior?`)) {
                appState = JSON.parse(savedState);
                appState.editingEvent = null;
                teamA = teams.teamA; teamB = teams.teamB;
                nameA = teams.nameA || 'A'; nameB = teams.nameB || 'B';
                meetupDate = teams.meetupDate;
                if (teams.colorA) {
                    document.documentElement.style.setProperty('--color-light', teams.colorA);
                    document.documentElement.style.setProperty('--color-light-text', teams.colorTextA);
                    document.documentElement.style.setProperty('--color-dark', teams.colorB);
                    document.documentElement.style.setProperty('--color-dark-text', teams.colorTextB);
                }
                renderApp();
                return;
            }
            localStorage.removeItem('pyball_current_match');
            localStorage.removeItem('pyball_teams');
        }

        const teamAParam = params.get('teamA');
        const teamBParam = params.get('teamB');
        if (!teamAParam || !teamBParam) {
            loadActiveMatch();
            return;
        }

        meetupDate = urlDate;
        nameA = params.get('nameA') || 'A';
        nameB = params.get('nameB') || 'B';
        teamA = teamAParam.split(',');
        teamB = teamBParam.split(',');

        localStorage.setItem('pyball_teams', JSON.stringify({
            teamA, teamB, nameA, nameB, meetupDate,
            colorA: colorA || null,
            colorB: colorB || null,
            colorTextA: colorTextA || null,
            colorTextB: colorTextB || null,
        }));
        renderApp();
    }

    async function loadActiveMatch() {
        try {
            const res = await fetch('/api/match/active');
            if (!res.ok) {
                localStorage.removeItem('pyball_current_match');
                localStorage.removeItem('pyball_teams');
                renderNoMatch();
                return;
            }
            const data = await res.json();
            meetupDate = data.date;
            nameA = data.nameA;
            nameB = data.nameB;
            teamA = data.teamA;
            teamB = data.teamB;
            document.documentElement.style.setProperty('--color-light', data.colorA);
            document.documentElement.style.setProperty('--color-light-text', data.colorTextA);
            document.documentElement.style.setProperty('--color-dark', data.colorB);
            document.documentElement.style.setProperty('--color-dark-text', data.colorTextB);
            localStorage.setItem('pyball_teams', JSON.stringify({
                teamA, teamB, nameA, nameB, meetupDate,
                colorA: data.colorA, colorB: data.colorB,
                colorTextA: data.colorTextA, colorTextB: data.colorTextB,
            }));
            renderApp();
        } catch {
            renderNoMatch();
        }
    }

    async function loadEditMode(date) {
        try {
            const res = await fetch('/api/match/' + encodeURIComponent(date) + '/events');
            if (!res.ok) { renderNoMatch(); return; }
            const data = await res.json();
            meetupDate = data.date;
            nameA = data.nameA;
            nameB = data.nameB;
            teamA = data.teamA;
            teamB = data.teamB;
            if (data.colorA) {
                document.documentElement.style.setProperty('--color-light', data.colorA);
                document.documentElement.style.setProperty('--color-light-text', data.colorTextA);
                document.documentElement.style.setProperty('--color-dark', data.colorB);
                document.documentElement.style.setProperty('--color-dark-text', data.colorTextB);
            }
            appState.events = data.events;
            appState.editingEvent = null;
            renderApp();
        } catch {
            renderNoMatch();
        }
    }

    function formatMatchDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        const day = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        return `${day.charAt(0).toUpperCase()}${day.slice(1)} · ${time}`;
    }

    // ── GOAL REGISTRATION ─────────────────────────────────
    function selectPlayer(playerName, teamId) {
        if (appState.currentStep === 1) {
            appState.tempScorer = playerName;
            appState.tempScorerTeam = teamId;
            appState.currentStep = 2;
        } else {
            registerGoal(playerName);
            return;
        }
        renderApp();
    }

    function registerGoal(assistantName) {
        appState.events.unshift({
            type: 'gol',
            scorer: appState.tempScorer,
            assistant: assistantName || null,
            team: appState.tempScorerTeam,
            timestamp: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        });
        appState.currentStep = 1;
        appState.tempScorer = null;
        appState.tempScorerTeam = null;
        persistState();
        renderApp();
    }

    function cancelGoal() {
        appState.currentStep = 1;
        appState.tempScorer = null;
        appState.tempScorerTeam = null;
        persistState();
        renderApp();
    }

    function deleteEvent(i) {
        appState.events.splice(i, 1);
        appState.editingEvent = null;
        persistState();
        renderApp();
    }

    // ── RENDERING COMPONENTS ──────────────────────────────
    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderPickerDropdown(eventIndex, field) {
        const e = appState.events[eventIndex];
        const players = e.team === 'A' ? teamA : teamB;
        const opts = field === 'scorer' ? players : players.filter(p => p !== e.scorer);

        let html = `<div class="picker-dropdown" onclick="event.stopPropagation()">`;
        opts.forEach(p => {
            const pSafe = p.replace(/'/g, "\\'");
            const sel = field === 'scorer' ? p === e.scorer : p === e.assistant;
            html += `<div class="picker-item ${sel ? 'selected' : ''}" onclick="event.stopPropagation();updateEventPlayer(${eventIndex},'${field}','${pSafe}')">${escHtml(p)}</div>`;
        });

        if (field === 'assistant') {
            html += `<div class="picker-item no-assist ${e.assistant === null ? 'selected' : ''}" onclick="event.stopPropagation();clearAssist(${eventIndex})">Sin asistente</div>`;
        }
        html += `</div>`;
        return html;
    }

    function togglePicker(eventIndex, field) {
        const already = appState.editingEvent !== null &&
                        appState.editingEvent.eventIndex === eventIndex &&
                        appState.editingEvent.field === field;
        appState.editingEvent = already ? null : { eventIndex, field };
        renderApp();
    }

    function updateEventPlayer(eventIndex, field, playerName) {
        if (field === 'scorer' && appState.events[eventIndex].assistant === playerName) {
            appState.events[eventIndex].assistant = null;
        }
        appState.events[eventIndex][field] = playerName;
        appState.editingEvent = null;
        persistState();
        renderApp();
    }

    function clearAssist(eventIndex) {
        appState.events[eventIndex].assistant = null;
        appState.editingEvent = null;
        persistState();
        renderApp();
    }

    function renderEventRow(e, i) {
        const scorerOpen = appState.editingEvent?.eventIndex === i && appState.editingEvent?.field === 'scorer';
        const assistOpen = appState.editingEvent?.eventIndex === i && appState.editingEvent?.field === 'assistant';

        const scorerChip = `
            <button class="player-chip ${scorerOpen ? 'active' : ''}" onclick="event.stopPropagation();togglePicker(${i},'scorer')">
                <span class="truncate-text">${escHtml(e.scorer)}</span> <span class="chevron">${scorerOpen ? '▲' : '▼'}</span>
            </button>`;

        const assistLabel = e.assistant ? e.assistant : 'Sin asistente';
        const assistChip = `
            <button class="player-chip ${assistOpen ? 'active' : ''}" onclick="event.stopPropagation();togglePicker(${i},'assistant')">
                <span class="truncate-text">${escHtml(assistLabel)}</span> <span class="chevron">${assistOpen ? '▲' : '▼'}</span>
            </button>`;

        return `
            <div class="event-log ${scorerOpen || assistOpen ? 'editing' : ''}" onclick="event.stopPropagation()" style="display:flex;align-items:center;gap:4px;">
                <span class="event-time" style="flex: 0 0 42px; text-align:center;">${e.timestamp}</span>
                <span style="flex: 1; min-width: 0; display: flex; justify-content: center;">${scorerChip}</span>
                <span style="flex: 1; min-width: 0; display: flex; justify-content: center;">${assistChip}</span>
                <button class="delete-btn" style="flex: 0 0 35px; display: flex; justify-content: center; align-items: center;" onclick="event.stopPropagation();deleteEvent(${i})">🗑</button>

                ${scorerOpen ? renderPickerDropdown(i, 'scorer') : ''}
                ${assistOpen ? renderPickerDropdown(i, 'assistant') : ''}
            </div>
        `;
    }

    function renderPlayersTab() {
        const { currentStep, tempScorer, tempScorerTeam } = appState;
        const instructionText = currentStep === 1 ? '¿Quién ha marcado gol?' : `⚽ ${tempScorer} marcó — ¿quién asistió?`;

        let colAHtml = '', colBHtml = '';
        let colAClass = 'team-col', colBClass = 'team-col';

        const btnHtml = (p, teamId) => `<button class="player-btn btn-${teamId.toLowerCase()}" onclick="selectPlayer('${p}', '${teamId}')">${p}</button>`;
        const noAssistBtn = (scorerTeam) => {
            const oppositeClass = scorerTeam === 'A' ? 'btn-b' : 'btn-a';
            return `<button class="player-btn ${oppositeClass}" onclick="registerGoal(null)">Sin asistente</button>`;
        };
        const cancelBtn = (teamId) => `<button class="cancel-full-btn btn-${teamId.toLowerCase()}" onclick="cancelGoal()">Cancelar</button>`;

        if (currentStep === 1) {
            colAHtml = teamA.map(p => btnHtml(p, 'A')).join('');
            colBHtml = teamB.map(p => btnHtml(p, 'B')).join('');
        } else if (tempScorerTeam === 'A') {
            colAHtml = teamA.map(p => p === tempScorer ? noAssistBtn('A') : btnHtml(p, 'A')).join('');
            colBHtml = cancelBtn('B');
            colBClass += ' waiting';
        } else {
            colBHtml = teamB.map(p => p === tempScorer ? noAssistBtn('B') : btnHtml(p, 'B')).join('');
            colAHtml = cancelBtn('A');
            colAClass += ' waiting';
        }

        return `
            <div class="scoreboard">
                <div class="team-score">
                    <div class="team-name">${nameA}</div>
                    <div class="score-number score-a">${getGoals('A')}</div>
                </div>
                <div class="score-separator">–</div>
                <div class="team-score">
                    <div class="team-name">${nameB}</div>
                    <div class="score-number score-b">${getGoals('B')}</div>
                </div>
            </div>
            <p class="instruction ${currentStep === 2 ? 'assist' : ''}">${instructionText}</p>
            <div class="player-grid">
                <div class="${colAClass}">${colAHtml}</div>
                <div class="${colBClass}">${colBHtml}</div>
            </div>
        `;
    }

    function renderEventsTab() {
        const eventsHtml = appState.events.length > 0
            ? appState.events.map((e, i) => renderEventRow(e, i)).join('')
            : `<div class="event-log" style="color:#64748b;justify-content:center;"><em>No hay eventos aún...</em></div>`;

        const saveLabel = isEditMode ? '💾 GUARDAR CORRECCIÓN' : '💾 CONFIRMAR Y GUARDAR PARTIDO';
        const saveAction = isEditMode ? 'editMatch()' : 'finishMatch()';

        return `
            <div>
                ${isEditMode ? '<div class="edit-mode-banner">✏️ Modo edición — corrección de resultado</div>' : ''}
                <div id="event-list">
                    <div class="event-log" style="display:flex;align-items:center;gap:4px;padding:8px 4px;font-size:0.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;">
                        <span style="flex: 0 0 42px;"></span>
                        <span style="flex: 1; text-align:center;">Goleador</span>
                        <span style="flex: 1; text-align:center;">Asistente</span>
                        <span style="flex: 0 0 35px;"></span>
                    </div>
                    ${eventsHtml}
                </div>
                <button id="save-btn" class="save-btn" onclick="${saveAction}">${saveLabel}</button>
            </div>
        `;
    }

    function renderNoMatch() {
        document.getElementById('app').innerHTML = `
            <div class="no-match">
                <div class="no-match-icon">⚽</div>
                <div class="no-match-title">PyBall</div>
                <div class="no-match-msg">No hay partido activo.<br>Espera a que se generen los equipos.</div>
                <button class="save-btn" style="max-width:200px;margin-top:8px;" onclick="loadActiveMatch()">🔄 Reintentar</button>
            </div>`;
    }

    // ── MAIN CONTROLLER ───────────────────────────────────
    function renderApp() {
        document.getElementById('app').innerHTML = `
            <div style="height:100svh;display:flex;flex-direction:column;padding:8px 12px 12px;">
                <div class="match-date">${formatMatchDate(meetupDate)}</div>
                <div class="tab-bar">
                    <button class="tab-btn ${appState.activeTab === 'players' ? 'active' : ''}" onclick="setTab('players')">Jugadores</button>
                    <button class="tab-btn ${appState.activeTab === 'events' ? 'active' : ''}" onclick="setTab('events')">Eventos y Resultados</button>
                </div>
                ${appState.activeTab === 'players' ? renderPlayersTab() : ''}
                ${appState.activeTab === 'events' ? renderEventsTab() : ''}
            </div>
        `;
    }

    // ── API ───────────────────────────────────────────────
    async function finishMatch() {
        if (!confirm('¿Seguro que quieres guardar el partido y enviarlo al Bot?')) return;
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Enviando datos...';
        try {
            const response = await fetch('/api/match/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    meetup_date: meetupDate,
                    events: [...appState.events].reverse(),
                    finalScore: { A: getGoals('A'), B: getGoals('B') }
                })
            });
            if (response.ok) {
                localStorage.removeItem('pyball_current_match');
                localStorage.removeItem('pyball_teams');
                document.getElementById('app').innerHTML = `
                    <div class="no-match">
                        <div class="success-banner">✅ Partido guardado y enviado a Telegram</div>
                        <div class="no-match-icon">⚽</div>
                        <div class="no-match-title">PyBall</div>
                        <div class="no-match-msg">Abre el enlace desde<br>Telegram para el próximo partido.</div>
                    </div>`;
            } else {
                const err = await response.json();
                alert(`❌ Error del servidor: ${err.detail || response.statusText}`);
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 CONFIRMAR Y GUARDAR PARTIDO';
            }
        } catch {
            alert('❌ Error de red. Revisa la conexión e inténtalo de nuevo.');
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 CONFIRMAR Y GUARDAR PARTIDO';
        }
    }

    async function editMatch() {
        if (!confirm('¿Guardar la corrección y reenviar el resumen a Telegram?')) return;
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Enviando corrección...';
        try {
            const response = await fetch('/api/match/' + encodeURIComponent(meetupDate) + '/edit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    meetup_date: meetupDate,
                    events: [...appState.events].reverse(),
                    finalScore: { A: getGoals('A'), B: getGoals('B') }
                })
            });
            if (response.ok) {
                document.getElementById('app').innerHTML = `
                    <div class="no-match">
                        <div class="success-banner">✅ Corrección guardada y reenviada a Telegram</div>
                        <div class="no-match-icon">⚽</div>
                        <div class="no-match-title">PyBall</div>
                        <div class="no-match-msg">Resultado corregido correctamente.</div>
                    </div>`;
            } else {
                const err = await response.json();
                alert(`❌ Error del servidor: ${err.detail || response.statusText}`);
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 GUARDAR CORRECCIÓN';
            }
        } catch {
            alert('❌ Error de red. Revisa la conexión e inténtalo de nuevo.');
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 GUARDAR CORRECCIÓN';
        }
    }

    // ── EVENT LISTENERS AND BOOTSTRAP ─────────────────────
    document.addEventListener('click', () => {
        if (appState.editingEvent !== null) {
            appState.editingEvent = null;
            renderApp();
        }
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
    }

    initializeApp();
</script>
</body>
</html>
