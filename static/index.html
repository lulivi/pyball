<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <title>PyBall - Muro de Partido</title>
    <style>
        :root { --color-light: #e4e4e7; --color-light-text: #27272a; --color-dark: #27272a; --color-dark-text: #e4e4e7; --bg: #0f172a; --text: #f8fafc; }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, sans-serif;
            overflow-y: auto;
        }

        /* ── ABOVE FOLD ──────────────────────────────────── */
        .above-fold {
            height: 100svh;
            display: flex;
            flex-direction: column;
            padding: 8px 12px 4px;
        }

        .match-date {
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            padding: 2px 0 4px;
            flex-shrink: 0;
        }

        .scoreboard {
            background: #71717a;
            border-radius: 10px;
            border: 1px solid #a1a1aa;
            padding: 8px 12px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .team-score { display: flex; flex-direction: column; align-items: center; flex: 1; }

        .team-name {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            text-align: center;
        }

        .score-number {
            font-size: clamp(4rem, 35vw, 8.5rem);
            font-weight: bold;
            line-height: 1;
        }

        .score-a { color: var(--color-light); }
        .score-b { color: var(--color-dark); }

        .score-separator {
            font-size: clamp(1.5rem, 7vw, 3rem);
            font-weight: bold;
            color: #1e293b;
            padding: 0 8px;
        }

        .instruction {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
            margin: 0 0 6px;
            flex-shrink: 0;
        }

        .instruction.assist { color: #fbbf24; }

        .player-grid { display: flex; gap: 8px; flex: 1; min-height: 0; }

        .team-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .team-col.waiting {
            align-items: center;
            justify-content: center;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 6px;
            border: 1px dashed #334155;
        }

        .waiting-text { font-size: 0.8rem; color: #64748b; text-align: center; padding: 8px; }

        .player-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 0;
            min-height: 44px;
        }

        .btn-a { background: var(--color-light); color: var(--color-light-text); }
        .btn-b { background: var(--color-dark); color: var(--color-dark-text); }
        .btn-noassist { background: #ca8a04; }

        /* ── TABS ────────────────────────────────────────── */
        .tab-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 4px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #334155;
            color: #f8fafc;
        }

        .cancel-btn {
            display: block; width: 100%;
            padding: 9px; font-size: 0.85rem; font-weight: 600;
            color: #f87171; background: transparent;
            border: 1px solid #f87171; border-radius: 6px;
            cursor: pointer; text-align: center; margin-bottom: 6px;
        }

        .scroll-hint {
            text-align: center;
            font-size: 0.65rem;
            color: #475569;
            padding: 4px 0 2px;
            flex-shrink: 0;
        }

        /* ── BELOW FOLD ──────────────────────────────────── */
        .below-fold { padding: 12px 12px 24px; }

        .events-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        #event-list {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            padding: 6px 10px;
            margin-bottom: 12px;
        }

        .event-log {
            font-size: 0.85rem;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            padding: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-log:last-child { border-bottom: none; }

        .event-time { font-size: 0.75rem; color: #64748b; flex-shrink: 0; margin-left: 8px; }

        .player-chip {
            display: inline-flex; align-items: center; gap: 3px;
            background: #0f172a; border: 1px solid #475569;
            border-radius: 4px; padding: 2px 7px;
            font-size: 0.78rem; font-weight: 600; cursor: pointer;
            color: #f8fafc; white-space: nowrap; vertical-align: middle;
            line-height: 1.4;
        }
        .player-chip.active { border-color: var(--color-dark-text); background: var(--color-dark); }
        .player-chip .chevron { font-size: 0.6rem; color: #94a3b8; }

        .delete-btn {
            background: transparent; border: none; color: #ef4444;
            font-size: 0.9rem; cursor: pointer; padding: 2px 4px; flex-shrink: 0;
        }

        .event-log.editing { flex-wrap: wrap; align-items: flex-start; }

        .picker-dropdown {
            background: #1e293b; border: 1px solid #475569; border-radius: 8px;
            padding: 4px; margin-top: 4px;
            max-height: 180px; overflow-y: auto;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .picker-item {
            padding: 6px 10px; border-radius: 5px; font-size: 0.8rem;
            cursor: pointer; color: #f8fafc;
        }
        .picker-item:active { background: #334155; }
        .picker-item.selected { background: #1d4ed8; }
        .picker-item.no-assist { color: #fbbf24; }

        .save-btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: #16a34a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .save-btn:disabled { background: #475569; cursor: not-allowed; }

        /* ── NO MATCH / SUCCESS ──────────────────────────── */
        .no-match {
            height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            gap: 12px;
        }

        .no-match-icon { font-size: 3rem; }
        .no-match-title { font-size: 1.4rem; font-weight: bold; }
        .no-match-msg { font-size: 1rem; color: #64748b; line-height: 1.6; }

        .success-banner {
            background: #15803d;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    // ── STATE ─────────────────────────────────────────────
    let teamA = [], teamB = [];
    let nameA = 'A', nameB = 'B';
    let meetupDate = '';

    let appState = {
        goalsA: 0, goalsB: 0,
        events: [],
        currentStep: 1,
        tempScorer: null, tempScorerTeam: null,
        editingEvent: null
    };

    // ── DATE FORMAT ───────────────────────────────────────
    function formatMatchDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '';
        const day = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        return day.charAt(0).toUpperCase() + day.slice(1) + ' · ' + time;
    }

    // ── INIT ──────────────────────────────────────────────
    function initializeApp() {
        const savedState = localStorage.getItem('pyball_current_match');
        const savedTeams = localStorage.getItem('pyball_teams');

        const params = new URLSearchParams(window.location.search);
        const urlDate = params.get('date') || '';

        if (savedState && savedTeams) {
            const teams = JSON.parse(savedTeams);
            if (!urlDate || teams.meetupDate === urlDate) {
                appState = JSON.parse(savedState);
                appState.editingEvent = null;
                teamA = teams.teamA;
                teamB = teams.teamB;
                nameA = teams.nameA || 'A';
                nameB = teams.nameB || 'B';
                meetupDate = teams.meetupDate;
                renderApp();
                return;
            }
            const oldDate = formatMatchDate(teams.meetupDate);
            const confirmed = confirm(
                'Hay un partido del ' + oldDate + ' sin guardar.\n¿Empezar el partido de hoy y descartar el anterior?'
            );
            if (!confirmed) {
                appState = JSON.parse(savedState);
                appState.editingEvent = null;
                teamA = teams.teamA;
                teamB = teams.teamB;
                nameA = teams.nameA || 'A';
                nameB = teams.nameB || 'B';
                meetupDate = teams.meetupDate;
                renderApp();
                return;
            }
            localStorage.removeItem('pyball_current_match');
            localStorage.removeItem('pyball_teams');
        }

        const teamAParam = params.get('teamA');
        const teamBParam = params.get('teamB');
        meetupDate = urlDate;
        nameA = params.get('nameA') || 'A';
        nameB = params.get('nameB') || 'B';

        if (!teamAParam || !teamBParam) {
            renderNoMatch();
            return;
        }

        teamA = teamAParam.split(',');
        teamB = teamBParam.split(',');
        localStorage.setItem('pyball_teams', JSON.stringify({ teamA, teamB, nameA, nameB, meetupDate }));
        renderApp();
    }

    // ── GOAL REGISTRATION ─────────────────────────────────
    function selectPlayer(playerName, teamId) {
        if (appState.currentStep === 1) {
            appState.tempScorer = playerName;
            appState.tempScorerTeam = teamId;
            appState.currentStep = 2;
        } else {
            registerGoal(playerName);
            return;
        }
        renderApp();
    }

    function registerGoal(assistantName) {
        appState.events.unshift({
            type: 'gol',
            scorer: appState.tempScorer,
            assistant: assistantName || null,
            team: appState.tempScorerTeam,
            timestamp: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        });
        if (appState.tempScorerTeam === 'A') appState.goalsA++;
        if (appState.tempScorerTeam === 'B') appState.goalsB++;
        appState.currentStep = 1;
        appState.tempScorer = null;
        appState.tempScorerTeam = null;
        localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        renderApp();
    }

    function cancelGoal() {
        appState.currentStep = 1;
        appState.tempScorer = null;
        appState.tempScorerTeam = null;
        localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        renderApp();
    }

    function deleteEvent(i) {
        appState.events.splice(i, 1);
        appState.goalsA = appState.events.filter(function(e) { return e.team === 'A'; }).length;
        appState.goalsB = appState.events.filter(function(e) { return e.team === 'B'; }).length;
        appState.editingEvent = null;
        localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        renderApp();
    }

    // ── RENDERING ─────────────────────────────────────────
    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderEventRow(e, i) {
        var scorerOpen = appState.editingEvent !== null &&
                         appState.editingEvent.eventIndex === i &&
                         appState.editingEvent.field === 'scorer';
        var assistOpen = appState.editingEvent !== null &&
                         appState.editingEvent.eventIndex === i &&
                         appState.editingEvent.field === 'assistant';

        var scorerChip =
            '<button class="player-chip' + (scorerOpen ? ' active' : '') +
            '" onclick="event.stopPropagation();togglePicker(' + i + ',\'scorer\')">' +
            escHtml(e.scorer) + ' <span class="chevron">' + (scorerOpen ? '▲' : '▼') + '</span></button>';

        var assistLabel = e.assistant ? e.assistant : 'Sin asist.';
        var assistChip =
            '<button class="player-chip' + (assistOpen ? ' active' : '') +
            '" onclick="event.stopPropagation();togglePicker(' + i + ',\'assistant\')">' +
            escHtml(assistLabel) + ' <span class="chevron">' + (assistOpen ? '▲' : '▼') + '</span></button>';

        var isEditing = scorerOpen || assistOpen;
        var html =
            '<div class="event-log' + (isEditing ? ' editing' : '') +
            '" onclick="event.stopPropagation()">' +
            '<span style="display:flex;align-items:center;gap:4px;flex:1;flex-wrap:wrap">' +
            '⚽ ' + scorerChip +
            '<span style="color:#64748b;font-size:0.75rem"> (Asist: </span>' +
            assistChip +
            '<span style="color:#64748b;font-size:0.75rem">)</span>' +
            '</span>' +
            '<span class="event-time">' + e.timestamp + '</span>' +
            '<button class="delete-btn" onclick="event.stopPropagation();deleteEvent(' + i + ')">🗑</button>';

        if (scorerOpen) { html += renderPickerDropdown(i, 'scorer'); }
        if (assistOpen) { html += renderPickerDropdown(i, 'assistant'); }
        html += '</div>';
        return html;
    }

    function renderPickerDropdown(eventIndex, field) {
        var e = appState.events[eventIndex];
        var players = e.team === 'A' ? teamA : teamB;
        var opts = field === 'scorer' ? players : players.filter(function(p) { return p !== e.scorer; });
        var html = '<div class="picker-dropdown" onclick="event.stopPropagation()">';
        opts.forEach(function(p) {
            var pSafe = p.replace(/'/g, "\\'");
            var sel = field === 'scorer' ? p === e.scorer : p === e.assistant;
            html += '<div class="picker-item' + (sel ? ' selected' : '') +
                    '" onclick="event.stopPropagation();updateEventPlayer(' + eventIndex + ',\'' +
                    field + '\',\'' + pSafe + '\')">' + escHtml(p) + '</div>';
        });
        if (field === 'assistant') {
            html += '<div class="picker-item no-assist' + (e.assistant === null ? ' selected' : '') +
                    '" onclick="event.stopPropagation();clearAssist(' + eventIndex + ')">Sin asistente</div>';
        }
        html += '</div>';
        return html;
    }

    function togglePicker(eventIndex, field) {
        var already = appState.editingEvent !== null &&
                      appState.editingEvent.eventIndex === eventIndex &&
                      appState.editingEvent.field === field;
        appState.editingEvent = already ? null : { eventIndex: eventIndex, field: field };
        renderApp();
    }

    function updateEventPlayer(eventIndex, field, playerName) {
        appState.events[eventIndex][field] = playerName;
        appState.editingEvent = null;
        localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        renderApp();
    }

    function clearAssist(eventIndex) {
        appState.events[eventIndex].assistant = null;
        appState.editingEvent = null;
        localStorage.setItem('pyball_current_match', JSON.stringify(appState));
        renderApp();
    }

    function renderNoMatch() {
        document.getElementById('app').innerHTML =
            '<div class="no-match">' +
            '<div class="no-match-icon">⚽</div>' +
            '<div class="no-match-title">PyBall</div>' +
            '<div class="no-match-msg">Abre el enlace desde<br>Telegram para empezar un partido.</div>' +
            '</div>';
    }

    function renderApp() {
        const step = appState.currentStep;
        const scorer = appState.tempScorer;
        const scorerTeam = appState.tempScorerTeam;

        const instructionText = step === 1
            ? '¿Quién ha marcado gol?'
            : '⚽ ' + scorer + ' marcó — ¿quién asistió?';

        let colAHtml = '', colBHtml = '';
        let colAClass = 'team-col', colBClass = 'team-col';

        if (step === 1) {
            colAHtml = teamA.map(p =>
                '<button class="player-btn btn-a" onclick="selectPlayer(\'' + p + '\', \'A\')">' + p + '</button>'
            ).join('');
            colBHtml = teamB.map(p =>
                '<button class="player-btn btn-b" onclick="selectPlayer(\'' + p + '\', \'B\')">' + p + '</button>'
            ).join('');
        } else if (scorerTeam === 'A') {
            colAHtml = teamA.filter(p => p !== scorer).map(p =>
                '<button class="player-btn btn-a" onclick="selectPlayer(\'' + p + '\', \'A\')">' + p + '</button>'
            ).join('') + '<button class="player-btn btn-noassist" onclick="registerGoal(null)">Sin asist.</button>';
            colBHtml = '<div class="waiting-text">Equipo ' + nameB + '<br>no asiste</div>';
            colBClass = 'team-col waiting';
        } else {
            colBHtml = teamB.filter(p => p !== scorer).map(p =>
                '<button class="player-btn btn-b" onclick="selectPlayer(\'' + p + '\', \'B\')">' + p + '</button>'
            ).join('') + '<button class="player-btn btn-noassist" onclick="registerGoal(null)">Sin asist.</button>';
            colAHtml = '<div class="waiting-text">Equipo ' + nameA + '<br>no asiste</div>';
            colAClass = 'team-col waiting';
        }

        const eventsHtml = appState.events.length > 0
            ? appState.events.map(function(e, i) { return renderEventRow(e, i); }).join('')
            : '<div class="event-log" style="color:#64748b;justify-content:center;"><em>No hay eventos aún...</em></div>';

        document.getElementById('app').innerHTML =
            '<div class="above-fold">' +
            '<div class="match-date">' + formatMatchDate(meetupDate) + '</div>' +
            '<div class="scoreboard">' +
            '<div class="team-score"><div class="team-name">' + nameA + '</div>' +
            '<div class="score-number score-a">' + appState.goalsA + '</div></div>' +
            '<div class="score-separator">–</div>' +
            '<div class="team-score"><div class="team-name">' + nameB + '</div>' +
            '<div class="score-number score-b">' + appState.goalsB + '</div></div>' +
            '</div>' +
            '<p class="instruction' + (step === 2 ? ' assist' : '') + '">' + instructionText + '</p>' +
            (step === 2 ? '<button class="cancel-btn" onclick="cancelGoal()">← Cancelar</button>' : '') +
            '<div class="player-grid">' +
            '<div class="' + colAClass + '">' + colAHtml + '</div>' +
            '<div class="' + colBClass + '">' + colBHtml + '</div>' +
            '</div>' +
            '<div class="scroll-hint">↓ eventos y guardar</div>' +
            '</div>' +
            '<div class="below-fold">' +
            '<div class="events-label">Eventos del partido</div>' +
            '<div id="event-list">' + eventsHtml + '</div>' +
            '<button id="save-btn" class="save-btn" onclick="finishMatch()">💾 CONFIRMAR Y GUARDAR PARTIDO</button>' +
            '</div>';
    }

    // ── API ───────────────────────────────────────────────
    async function finishMatch() {
        if (!confirm('¿Seguro que quieres guardar el partido y enviarlo al Bot?')) return;
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Enviando datos...';
        try {
            const response = await fetch('/api/match/finish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    meetup_date: meetupDate,
                    events: [...appState.events].reverse(),
                    finalScore: { A: appState.goalsA, B: appState.goalsB }
                })
            });
            if (response.ok) {
                localStorage.removeItem('pyball_current_match');
                localStorage.removeItem('pyball_teams');
                document.getElementById('app').innerHTML =
                    '<div class="no-match">' +
                    '<div class="success-banner">✅ Partido guardado y enviado a Telegram</div>' +
                    '<div class="no-match-icon">⚽</div>' +
                    '<div class="no-match-title">PyBall</div>' +
                    '<div class="no-match-msg">Abre el enlace desde<br>Telegram para el próximo partido.</div>' +
                    '</div>';
            } else {
                const err = await response.json();
                alert('❌ Error del servidor: ' + (err.detail || response.statusText));
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 CONFIRMAR Y GUARDAR PARTIDO';
            }
        } catch {
            alert('❌ Error de red. Revisa la conexión e inténtalo de nuevo.');
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 CONFIRMAR Y GUARDAR PARTIDO';
        }
    }

    // ── SERVICE WORKER ────────────────────────────────────
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err =>
            console.warn('SW registration failed:', err)
        );
    }

    document.addEventListener('click', function() {
        if (appState.editingEvent !== null) {
            appState.editingEvent = null;
            renderApp();
        }
    });

    initializeApp();
</script>
</body>
</html>
