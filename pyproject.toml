[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.poetry]
name = "pyball"
version = "0.0.0"
description = "App to manage meetup matches"
license = "MIT"
authors = ["Luis Liñán <luislivilla@gmail.com>"]
readme = "README.md"

[tool.poetry.group.dev.dependencies]
black = "24.*"
isort = "5.*"
nox = "*"

[tool.poetry.dependencies]
python = ">=3.8,<4.0"

[tool.black]
line-length = 99
preview = true
enable-unstable-feature = ["string_processing"]

[tool.isort]
profile = "black"
line_length = 99
lines_between_types = 1
