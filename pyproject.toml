[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "pyball"
version = "3.0.0"
description = "Bot to play them all"
license = { text = "MIT" }
authors = [{ name = "Luis Liñán", email = "luislivilla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-telegram-bot>=22,<23",
    "pydantic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1,<4",
    "playwright>=1.44,<2",
]

[project.scripts]
pyball = "pyball.__main__:main"

[dependency-groups]
dev = [
    "black==22.*",
    "isort==5.*",
    "mypy",
    "pycodestyle",
    "pydocstyle",
    "pylint",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-emoji",
    "pytest-timeout",
    "faker==18.*",
    "freezegun",
    "ddt>=1.7.1,<2",
]

[tool.black]
line-length = 99
preview = true

[tool.isort]
profile = "black"
line_length = 99
lines_between_types = 1

[tool.mypy]
show_error_codes = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["decouple", "event_bus", "playwright", "playwright.*"]

[tool.pydocstyle]
add-ignore = ["D105", "D107"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
