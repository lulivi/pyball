[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]

[tool.poetry-dynamic-versioning]
dirty = true
enable = true
format-jinja = "{% if distance == 0 %}{{ base }}{% if stage %}.{{ stage }}{% endif %}{% else %}{{ base }}+{{ distance }}.{{ commit }}{% endif %}"
latest-tag = true
vcs = "git"

[tool.poetry]
name = "pyball"
version = "0.0.0"
description = "Bot to play them all"
license = "MIT"
authors = ["Luis Liñán <luislivilla@gmail.com>"]
readme = "README.md"
packages = [{ include = "pyball" }]

[tool.poetry.scripts]
pyball = "pyball.__main__:main"

[tool.poetry.dev-dependencies]
black = "22.*"
isort = "5.*"
tox = "<4.0.0"
tox-poetry = "*"
mypy = "*"
pylama = "7.7.1"
pycodestyle = "*"
pydocstyle = "*"
pylint = "*"
types-peewee = "*"

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
python-telegram-bot = "20.0a4"
python-decouple = "3.6"
peewee = "3.15.3"
pyyaml = "6.0"
# testenv
pytest = { version = "*", optional = true }
pytest-cov = { version = "*", optional = true }
pytest-emoji = { version = "*", optional = true }

[tool.poetry.extras]
tox-test = [
    "pytest",
    "pytest-cov",
    "pytest-emoji",
]

[tool.black]
line-length = 99
preview = true

[tool.isort]
profile = "black"
line_length = 99
lines_between_types = 1

[tool.mypy]
show_error_codes = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["decouple"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "logging-fstring-interpolation"
]

[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = True
skip_missing_interpreters = true
envlist = format,py38,lint

[testenv]
extras = tox-test
commands =
    pytest -x {toxinidir}/tests/ --cov={toxinidir}/pyball/ --cov-report=term-missing -vvv

[testenv:format]
commands =
    black --check --diff {toxinidir}/pyball/ {toxinidir}/tests
    isort --check --diff {toxinidir}/pyball/ {toxinidir}/tests

[testenv:lint]
commands =
    pydocstyle {toxinidir}/pyball/ {toxinidir}/tests --add-ignore D105,D107
    pycodestyle {toxinidir}/pyball/ {toxinidir}/tests --max-line-length 99
    mypy {toxinidir}/pyball/ {toxinidir}/tests
    pylint {toxinidir}/pyball/ {toxinidir}/tests
"""
