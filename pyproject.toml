[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "pyball"
dynamic = ["version"]
description = "Bot to play them all"
license = { text = "MIT" }
authors = [{ name = "Luis Liñán", email = "luislivilla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-telegram-bot>=22,<23",
    "pydantic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1,<4",
    "weasyprint>=60,<62",
    "pymupdf>=1.24,<2",
]

[project.scripts]
pyball = "pyball.__main__:main"

[dependency-groups]
dev = [
    "black==22.*",
    "isort==5.*",
    "mypy",
    "pycodestyle",
    "pydocstyle",
    "pylint",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.mypy]
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
