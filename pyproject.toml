[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]

[tool.poetry-dynamic-versioning]
dirty = true
enable = true
format-jinja = "{% if distance == 0 %}{{ base }}{% if stage %}.{{ stage }}{% endif %}{% else %}{{ base }}+{{ distance }}.{{ commit }}{% endif %}"
latest-tag = true
vcs = "git"

[tool.poetry]
name = "pyball"
version = "0.0.0"
description = "Bot to play them all"
license = "MIT"
authors = ["Luis Liñán <luislivilla@gmail.com>"]
readme = "README.md"
packages = [{ include = "pyball" }]

[tool.poetry.scripts]
pyball = "pyball.__main__:main"

[tool.poetry.dev-dependencies]
black = "22.*"
isort = "5.*"
tox = "*"
mypy = "*"
pylama = "7.7.1"
pycodestyle = "*"
pydocstyle = "*"
pylint = "*"

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
python-telegram-bot = "20.*"
python-decouple = "3.6"
peewee = "3.15.3"
types-peewee = "*"
pyyaml = "6.0"
types-PyYAML = "^6.0.12.10"

[tool.poetry.group.test]
optional = true
[tool.poetry.group.test.dependencies]
coverage = {version = "6.2", extras = ["toml"]}
pytest = "*"
pytest-cov = "*"
pytest-emoji = "*"
pytest-timeout = "*"
Faker = "14.*"

[tool.black]
line-length = 99
preview = true

[tool.isort]
profile = "black"
line_length = 99
lines_between_types = 1

[tool.mypy]
show_error_codes = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["decouple"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "logging-fstring-interpolation"
]

[tool.tox]
legacy_tox_ini = """
[tox]
isolated_build = True
skip_missing_interpreters = true
envlist = format,py38,lint

[testenv]
skip_install = True
whitelist_externals = poetry
commands_pre =
    poetry install --with test --without dev
commands =
    pytest {posargs:{toxinidir}/tests/ --cov={toxinidir}/pyball/ --cov-report=term-missing} \
        -vvv

[testenv:format]
skip_install = True
whitelist_externals = poetry
commands_pre =
    poetry install --only dev
commands =
    black {toxinidir}/pyball/ {toxinidir}/tests/
    isort {toxinidir}/pyball/ {toxinidir}/tests/

[testenv:lint]
skip_install = True
whitelist_externals = poetry
commands_pre =
    poetry install
commands =
    black --check --diff {toxinidir}/pyball/ {toxinidir}/tests
    isort --check --diff {toxinidir}/pyball/ {toxinidir}/tests
    pydocstyle {toxinidir}/pyball/ {toxinidir}/tests --add-ignore D104,D105,D107
    pycodestyle {toxinidir}/pyball/ {toxinidir}/tests --max-line-length 99
    mypy {toxinidir}/pyball/ {toxinidir}/tests
    pylint {toxinidir}/pyball/ {toxinidir}/tests
"""
