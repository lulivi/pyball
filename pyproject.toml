[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project]
name = "pyball"
dynamic = ["version"]
description = "Bot to play them all"
license = { text = "MIT" }
authors = [{ name = "Luis Liñán", email = "luislivilla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1,<4",
    "weasyprint>=61,<70",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=22,<23"]

[project.scripts]
pyball = "pyball.cmd.run_pyball:main"
pyball-telegram = "pyball.cmd.run_telegram:main"

[dependency-groups]
dev = [
    "black==22.*",
    "isort==5.*",
    "mypy",
    "pycodestyle",
    "pydocstyle",
    "pylint",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "python-semantic-release>=9",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.mypy]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): v{version}\n\n[skip ci]"
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
# Push over the checkout's SSH remote (release deploy key, which bypasses the main ruleset).
ignore_token_for_push = true
