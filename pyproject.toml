
[tool.poetry]
name = "pyball"
version = "0.0.0"
description = "Bot to play them all"
license = "MIT"
authors = ["Luis Liñán <luislivilla@gmail.com>"]
readme = "README.md"
packages = [{ include = "pyball" }]

[tool.poetry.scripts]
pyball-run = "pyball.__main__:main"

[tool.poetry.dev-dependencies]
black = "22.3.0"
isort = "5.9.3"

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
python-telegram-bot = "20.0a2"
python-decouple = "3.6"

[tool.black]
line-length = 99
preview = true

[tool.isort]
profile = "black"
line_length = 99
lines_between_types = 1
