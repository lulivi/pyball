services:
  core:
    image: pyball
    user: "$UID:$UID"
    build:
      dockerfile: ./docker/Dockerfile
      args:
        USER: "$USER"
        UID: "$UID"
        PYBALL_COMPONENT: "core"
    environment:
      USER: "$USER"
      UID: "$UID"
    container_name: pyball
    networks:
      - pyballnet
    volumes:
      - .:/pyball
  bot:
    image: pyballbot
    user: "$UID:$UID"
    build:
      dockerfile: ./docker/Dockerfile
      args:
        USER: "$USER"
        UID: "$UID"
        PYBALL_COMPONENT: "bot"
    environment:
      USER: "$USER"
      UID: "$UID"
    container_name: pyballbot
    networks:
      - pyballnet
    depends_on:
      core:
        condition: service_started
    volumes:
      - .:/pyball
networks:
  pyballnet:
    driver: bridge
