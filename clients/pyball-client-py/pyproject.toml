[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyball-client"
version = "0.1.0"
description = "Client for PyBall's plugin API, for plugins written in Python"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[dependency-groups]
dev = [
    "black>=25,<26",
    "isort>=6,<7",
    "mypy>=1.15,<2",
    "pylint>=3.3,<4",
    "pytest>=8,<9",
    "pytest-asyncio>=0.26,<1",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pylint.main]
max-line-length = 99
disable = ["too-few-public-methods"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
