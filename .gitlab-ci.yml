stages:
  - publish

publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - ./scripts/docker_build.sh --push --release