stages:
  - prepare
  - ci
  - publish-telegram
  - publish-web
  - publish-caddy
  - deploy-telegram
  - deploy-web
  - deploy-caddy

build-ci-image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - docker/Dockerfile.ci
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f docker/Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci:latest"

.ci_base:
  stage: ci
  image: $CI_REGISTRY_IMAGE/ci:latest
  variables:
    UV_LINK_MODE: copy
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .nox/

lint:
  extends: .ci_base
  script:
    - nox -e lint

test:
  extends: .ci_base
  script:
    - nox -e test -- --junit-xml=TestReport.xml
  artifacts:
    when: always
    reports:
      junit: TestReport.xml

publish-telegram:
  stage: publish-telegram
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - ./deploy/docker_build.sh --push --release --topology telegram

deploy-telegram:
  stage: deploy-telegram
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - publish-telegram
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.tg.yaml "$SERVER_USER@$SERVER_IP:$SERVER_TENSORES_DIR/compose.yaml"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_TENSORES_DIR sh -s" < deploy/deploy.sh

publish-web:
  stage: publish-web
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - ./deploy/docker_build.sh --push --release --topology web

publish-caddy:
  stage: publish-caddy
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - docker/Dockerfile.caddy
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker build -f docker/Dockerfile.caddy -t lulivi/pyball-caddy:${VERSION} -t lulivi/pyball-caddy:latest .
    - docker push lulivi/pyball-caddy:${VERSION}
    - docker push lulivi/pyball-caddy:latest

deploy-web:
  stage: deploy-web
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - publish-web
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.web.yaml "$SERVER_USER@$SERVER_IP:$SERVER_CUCARACHAS_DIR/compose.yaml"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_CUCARACHAS_DIR sh -s" < deploy/deploy.sh

deploy-caddy:
  stage: deploy-caddy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - deploy/caddy/Caddyfile
        - compose.caddy.yaml
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.caddy.yaml "$SERVER_USER@$SERVER_IP:$SERVER_CADDY_DIR/compose.yaml"
    - scp deploy/caddy/Caddyfile "$SERVER_USER@$SERVER_IP:$SERVER_CADDY_DIR/Caddyfile"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_CADDY_DIR sh -s" < deploy/deploy.sh
