stages:
  - prepare
  - ci
  - publish
  - deploy

build-ci-image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - docker/Dockerfile.ci
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f docker/Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci:latest"

.ci_base:
  stage: ci
  image: $CI_REGISTRY_IMAGE/ci:latest
  variables:
    UV_LINK_MODE: copy
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .nox/

lint:
  extends: .ci_base
  script:
    - nox -e lint

test:
  extends: .ci_base
  script:
    - nox -e test -- --junit-xml=TestReport.xml
  artifacts:
    when: always
    reports:
      junit: TestReport.xml

publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - ./deploy/docker_build.sh --push --release --topology telegram

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - publish
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.yaml "$SERVER_USER@$SERVER_IP:$SERVER_APP_DIR/compose.yaml"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION sh -s" < deploy/deploy.sh
