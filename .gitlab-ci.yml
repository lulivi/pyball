stages:
  - publish

publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
  script:
    - bash scripts/docker_build.sh --push --release
