# Tag pipelines always run (publish/deploy). Branch pipelines for the release
# commit created by semantic-release are suppressed here instead of via
# "[skip ci]", because GitLab also skips the tag pipeline when the tagged
# commit message contains "[skip ci]" (gitlab-org/gitlab#292815).
workflow:
  rules:
    # Disabled: the project moved to GitHub; this file is kept as the reference
    # for porting CI to GitHub Actions (GitHub issue #5).
    - when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_TITLE =~ /^chore\(release\):/
      when: never
    - when: always

stages:
  - prepare
  - ci
  - release
  - publish
  - deploy

build-ci-image:
  stage: prepare
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - docker/Dockerfile.ci
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f docker/Dockerfile.ci -t "$CI_REGISTRY_IMAGE/ci:latest" .
    - docker push "$CI_REGISTRY_IMAGE/ci:latest"

.ci_base:
  stage: ci
  image: $CI_REGISTRY_IMAGE/ci:latest
  variables:
    UV_LINK_MODE: copy
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .nox/

lint:
  extends: .ci_base
  script:
    - nox -e lint

test:
  extends: .ci_base
  script:
    - nox -e test -- --junit-xml=TestReport.xml
  artifacts:
    when: always
    reports:
      junit: TestReport.xml

caddyfiles:
  stage: ci
  image: lulivi/pyball-caddy:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  variables:
    DUCKDNS_TOKEN: "dummy"
  script:
    - sh deploy/caddy/generate_caddyfiles.sh /tmp/caddy-gen
    - for f in Caddyfile Caddyfile.both Caddyfile.tensores Caddyfile.cucarachas Caddyfile.none; do diff "/tmp/caddy-gen/$f" "deploy/caddy/$f"; done
    - for f in deploy/caddy/Caddyfile*; do caddy validate --adapter caddyfile --config "$f"; done

release:
  stage: release
  image: $CI_REGISTRY_IMAGE/ci:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - lint
    - test
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    UV_LINK_MODE: copy
  script:
    - test -n "$GL_TOKEN" || { echo "GL_TOKEN CI/CD variable is not set"; exit 1; }
    - export GITLAB_TOKEN="$GL_TOKEN"
    - git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
    - uv run --only-group dev semantic-release version

.publish_base:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

publish-telegram:
  extends: .publish_base
  variables:
    GIT_DEPTH: 0
  script:
    - ./deploy/docker_build.sh --push --release --topology telegram

publish-pyball:
  extends: .publish_base
  variables:
    GIT_DEPTH: 0
  script:
    - ./deploy/docker_build.sh --push --release --topology pyball

# rules:changes always evaluates to true on tag pipelines, so caddy-related
# changes are detected by diffing against the previous tag instead. The result
# is forwarded to deploy-caddy through the dotenv report.
publish-caddy:
  extends: .publish_base
  variables:
    GIT_DEPTH: 0
    CADDY_PATHS: docker/Dockerfile.caddy docker/Dockerfile.funnelbot deploy/caddy compose.caddy.yaml
  artifacts:
    reports:
      dotenv: caddy.env
  script:
    - PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_SHA}^" 2>/dev/null || echo "")
    - |
      if [ -n "$PREV_TAG" ] && git diff --quiet "$PREV_TAG" "$CI_COMMIT_SHA" -- $CADDY_PATHS; then
        echo "No caddy changes since ${PREV_TAG}; skipping publish."
        echo "CADDY_CHANGED=false" > caddy.env
        exit 0
      fi
    - echo "CADDY_CHANGED=true" > caddy.env
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker build -f docker/Dockerfile.caddy -t lulivi/pyball-caddy:${VERSION} -t lulivi/pyball-caddy:latest .
    - docker push lulivi/pyball-caddy:${VERSION}
    - docker push lulivi/pyball-caddy:latest
    - docker build -f docker/Dockerfile.funnelbot -t lulivi/pyball-funnelbot:${VERSION} -t lulivi/pyball-funnelbot:latest .
    - docker push lulivi/pyball-funnelbot:${VERSION}
    - docker push lulivi/pyball-funnelbot:latest

.ssh_deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan "$SERVER_IP" >> ~/.ssh/known_hosts

deploy-telegram:
  extends: .ssh_deploy
  needs:
    - publish-telegram
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.tg.yaml "$SERVER_USER@$SERVER_IP:$SERVER_TENSORES_DIR/compose.yaml"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_TENSORES_DIR sh -s" < deploy/deploy.sh

deploy-pyball:
  extends: .ssh_deploy
  needs:
    - publish-pyball
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.pyball.yaml "$SERVER_USER@$SERVER_IP:$SERVER_CUCARACHAS_DIR/compose.yaml"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_CUCARACHAS_DIR sh -s" < deploy/deploy.sh

deploy-caddy:
  extends: .ssh_deploy
  needs:
    - publish-caddy
  script:
    - |
      if [ "$CADDY_CHANGED" != "true" ]; then
        echo "No caddy changes in this release; skipping deploy."
        exit 0
      fi
    - VERSION="${CI_COMMIT_TAG#v}"
    - scp compose.caddy.yaml "$SERVER_USER@$SERVER_IP:$SERVER_CADDY_DIR/compose.yaml"
    - scp deploy/caddy/Caddyfile* "$SERVER_USER@$SERVER_IP:$SERVER_CADDY_DIR/"
    - ssh "$SERVER_USER@$SERVER_IP" "VERSION=$VERSION APP_DIR=$SERVER_CADDY_DIR HEALTH_MODE=caddy sh -s" < deploy/deploy.sh
