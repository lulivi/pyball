[package]
name = "pyball-contract"
version = "0.1.0"
edition = "2024"
description = "Black-box contract suite for a PyBall core, over HTTP and data/"
publish = false

[features]
default = ["players", "meetups", "matches", "stats", "events"]
players = []
meetups = []
matches = []
stats = []
events = []

[dependencies]
jsonschema = { version = "0.63.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
